[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manim-software"
version = "0.1.0"
description = "Manim Community plugin for videos that explain how software systems work: system diagrams, packets on wires, sequence diagrams, and a few 3D props."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dav Yaginuma" }]
keywords = ["manim", "manim-plugin", "animation", "software", "architecture", "sequence-diagram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["manim>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/dav/manim-software"
Source = "https://github.com/dav/manim-software"
Issues = "https://github.com/dav/manim-software/issues"

[project.entry-points."manim.plugins"]
manim_software = "manim_software"

[tool.hatch.build.targets.sdist]
only-include = ["manim_software", "tests", "examples", "manim.cfg", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["manim_software"]
exclude = ["manim_software/assets/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
