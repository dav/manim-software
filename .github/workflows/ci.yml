name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + smoke render (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install the system libraries manim builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the package
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Unit tests
        run: uv run pytest

      # The unit tests never render. These scenes do: a still that touches
      # every 2D mobject (bundled SVG icons included), a clip of packets on
      # wires, the 3D props under a moving camera, and the full example story.
      - name: Smoke render
        run: |
          uv run manim -s -qm examples/request_flow.py SoftwareSmokeScene
          uv run manim -ql examples/request_flow.py PacketTest
          uv run manim -ql examples/request_flow.py DatabaseZoom
          uv run manim -ql examples/request_flow.py RequestFlow

      - name: Keep the rendered frames for eyeballing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-render-py${{ matrix.python-version }}
          path: |
            tmp/media/images/request_flow/*.png
            tmp/media/videos/request_flow/480p15/*.mp4
          if-no-files-found: ignore

  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - name: Check the wheel ships the assets directory
        run: unzip -l dist/*.whl | grep -q 'manim_software/assets/.*\.svg'
